<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="description" content="Andika helps Kenyan small businesses create social media content and post to Facebook, Instagram, WhatsApp, TikTok and X — from one simple dashboard. Start free."/>
<meta name="theme-color" content="#2563eb"/>
<meta property="og:title" content="Andika — Content that sells for Kenyan small businesses"/>
<meta property="og:description" content="AI captions in English, Kiswahili and Sheng. Post to all your platforms from one dashboard. Ksh 0 to start, Pro via M-PESA."/>
<meta property="og:type" content="website"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232563eb'/%3E%3Cpath d='M12 26V14l8 7 8-7v12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<title>Andika — Content that sells for Kenyan small businesses</title>
<style>
/* ============================================================
   ANDIKA — Design system
   Clean, Stripe-inspired blue. Palette, type scale, spacing.
   ============================================================ */
:root{
  /* Palette */
  --bg:#f6f9fc;
  --bg-grad-1:#eef4ff;
  --bg-grad-2:#f7fbff;
  --surface:#ffffff;
  --surface-2:#f2f6fb;
  --surface-3:#eaf0f8;
  --text:#0a2540;
  --muted:#425466;
  --muted-2:#6b7c93;
  --border:#e3e8f0;
  --border-strong:#cbd5e1;
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --primary-darker:#1e40af;
  --primary-soft:#e8effe;
  --primary-tint:#f0f5ff;
  --indigo:#4f46e5;
  --success:#0f9d58;
  --success-soft:#e6f6ee;
  --danger:#dc2626;
  --danger-soft:#fdecec;
  --warning:#b45309;
  --warning-soft:#fef3e2;
  --info:#0e7490;
  --info-soft:#e0f4f8;
  --fb:#1877f2;
  --ig:#c13584;
  --wa:#25d366;
  --tt:#0f172a;
  --x:#0f172a;

  /* Type */
  --font-display:"Plus Jakarta Sans","Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* Spacing scale */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-8:32px; --s-10:40px; --s-12:48px; --s-16:64px; --s-20:80px; --s-24:96px;

  /* Radius */
  --r-sm:6px; --r:10px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;

  /* Shadows */
  --shadow-xs:0 1px 2px rgba(16,42,67,.06);
  --shadow-sm:0 1px 3px rgba(16,42,67,.08),0 1px 2px rgba(16,42,67,.05);
  --shadow:0 4px 14px rgba(16,42,67,.08),0 2px 4px rgba(16,42,67,.04);
  --shadow-lg:0 18px 42px rgba(16,42,67,.14),0 6px 14px rgba(16,42,67,.06);
  --shadow-primary:0 8px 20px rgba(37,99,235,.28);

  --maxw:1160px;
  --nav-h:68px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font-body);color:var(--text);
  background:var(--bg);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,h5{font-family:var(--font-display);color:var(--text);margin:0 0 .4em;line-height:1.15;letter-spacing:-.02em;font-weight:800}
h1{font-size:clamp(32px,4.6vw,52px)}
h2{font-size:clamp(26px,3.2vw,36px)}
h3{font-size:21px}
h4{font-size:17px}
p{margin:0 0 1em}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-dark)}
img{max-width:100%}
button{font-family:inherit}
::selection{background:#c7d8fe}

.container{max-width:var(--maxw);margin:0 auto;padding:0 var(--s-6)}
.d-none-mobile{display:inline}
@media (max-width:768px){ .d-none-mobile{display:none} }
.section{padding:var(--s-20) 0}
.section-sm{padding:var(--s-12) 0}
.lead{font-size:18px;color:var(--muted);line-height:1.65}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.center{text-align:center}
.eyebrow{
  display:inline-block;font-family:var(--font-display);font-weight:700;font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--primary-dark);
  background:var(--primary-soft);padding:6px 14px;border-radius:var(--r-pill);margin-bottom:var(--s-4);
}
.grad-text{background:linear-gradient(90deg,#1d4ed8,#4f46e5 60%,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 20px;border-radius:var(--r-pill);border:1px solid transparent;
  font-family:var(--font-display);font-weight:700;font-size:14.5px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease,color .2s ease;
  text-decoration:none;white-space:nowrap;user-select:none;
}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-primary)}
.btn-primary:hover{background:var(--primary-dark);color:#fff;transform:translateY(-1px)}
.btn-dark{background:var(--text);color:#fff}
.btn-dark:hover{background:#143a5f;color:#fff;transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary-dark);transform:translateY(-1px)}
.btn-light{background:#fff;color:var(--primary-dark);box-shadow:var(--shadow-sm)}
.btn-light:hover{transform:translateY(-1px);color:var(--primary-darker)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c;color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-link{background:none;border:none;color:var(--primary);font-weight:700;min-height:44px;padding:0 10px;cursor:pointer;border-radius:var(--r-sm)}
.btn-link:hover{color:var(--primary-dark);text-decoration:underline}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.btn-lg{min-height:52px;padding:0 28px;font-size:16px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn .ico{width:18px;height:18px;flex:none}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:var(--s-6)}
.card-hover{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#d4def0}

/* ---------- Top navigation ---------- */
.nav{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.86);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);height:var(--nav-h);
}
.nav-inner{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 var(--s-6);display:flex;align-items:center;gap:var(--s-6)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text);letter-spacing:-.02em}
.brand:hover{color:var(--text)}
.brand-mark{width:34px;height:34px;flex:none;object-fit:contain;border-radius:8px}
.brand-lockup{max-width:100%;height:auto}
.footer-lockup{display:inline-block;background:#fff;border-radius:10px;padding:8px 12px;line-height:0}
.footer-lockup img{filter:none}
.sidebar .brand img.brand-mark{background:#fff;border-radius:8px;padding:3px}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:var(--s-4)}
.nav-links a{
  padding:9px 14px;border-radius:var(--r-pill);color:var(--muted);font-weight:600;font-size:14.5px;
  font-family:var(--font-display);transition:background .15s,color .15s;
}
.nav-links a:hover{color:var(--text);background:var(--surface-2)}
.nav-links a.active{color:var(--primary-dark);background:var(--primary-soft)}
.nav-cta{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-toggle{
  display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--border);background:#fff;
  border-radius:var(--r);cursor:pointer;align-items:center;justify-content:center;
}
.nav-toggle svg{width:22px;height:22px}
.mobile-menu{display:none;border-bottom:1px solid var(--border);background:#fff;padding:var(--s-4) var(--s-6);flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.mobile-menu.open{display:flex}
.mobile-menu a{padding:12px 12px;border-radius:var(--r);font-weight:600;color:var(--text);font-family:var(--font-display);min-height:44px;display:flex;align-items:center}
.mobile-menu a.active{background:var(--primary-soft);color:var(--primary-dark)}
.mobile-menu .mm-cta{margin-top:8px}
.avatar-chip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 12px 5px 5px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:13.5px;color:var(--text)}
.avatar-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 70%,var(--bg) 100%);padding:var(--s-20) 0 var(--s-16)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 300px at 85% 10%,rgba(79,70,229,.12),transparent 60%),
  radial-gradient(500px 280px at 10% 0%,rgba(37,99,235,.10),transparent 60%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--s-12);align-items:center;position:relative}
.hero h1 .grad-text{display:inline}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin:var(--s-6) 0 var(--s-4)}
.hero-proof{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.avatars{display:flex}
.avatars span{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-left:-8px;font-family:var(--font-display)}
.avatars span:first-child{margin-left:0}
.stars{color:#f59e0b;letter-spacing:2px}

/* Hero visual: app mock */
.app-mock{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden;transform:rotate(.5deg)}
.app-mock-bar{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--border);background:#fbfcfe;align-items:center}
.app-mock-bar i{width:10px;height:10px;border-radius:50%;display:block}
.app-mock-body{padding:var(--s-5)}
.mock-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.mock-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--muted);font-family:var(--font-display)}
.mock-post{border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-top:12px}
.mock-platform{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;font-family:var(--font-display)}
.plat-dot{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.plat-dot svg{width:13px;height:13px}

/* ---------- Logos / social proof ---------- */
.logo-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-8);align-items:center;padding:var(--s-6) 0;opacity:.78}
.logo-strip .ls{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--muted-2);display:flex;align-items:center;gap:8px;letter-spacing:-.01em}

/* ---------- Feature blocks ---------- */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-6)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s-6)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-5)}
.feature-icon{
  width:46px;height:46px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary-dark);margin-bottom:var(--s-4);
}
.feature-icon svg{width:24px;height:24px}
.feature-icon.ig{background:#fce7f3;color:#be185d}
.feature-icon.gn{background:var(--success-soft);color:var(--success)}
.feature-icon.am{background:var(--warning-soft);color:var(--warning)}
.feature-icon.in{background:var(--info-soft);color:var(--info)}
.feature-icon.pp{background:#ede9fe;color:#6d28d9}

/* Steps */
.steps{counter-reset:step;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-6)}
.step{position:relative;padding:var(--s-6);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.step-num{counter-increment:step;width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;font-family:var(--font-display);font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:var(--s-4)}
.step-num::before{content:counter(step)}

/* FAQ */
.faq{max-width:760px;margin:0 auto}
.faq-item{border:1px solid var(--border);border-radius:var(--r-md);background:#fff;margin-bottom:12px;overflow:hidden}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-display);font-weight:700;font-size:15.5px;color:var(--text);min-height:44px}
.faq-q svg{width:20px;height:20px;flex:none;transition:transform .25s ease;color:var(--primary)}
.faq-item.open .faq-q svg{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 20px;color:var(--muted)}
.faq-item.open .faq-a{max-height:400px;padding:0 20px 18px}

/* CTA band */
.cta-band{background:linear-gradient(120deg,#1d4ed8,#3b5bf0 55%,#4f46e5);border-radius:var(--r-xl);color:#fff;padding:var(--s-12) var(--s-10);text-align:center;position:relative;overflow:hidden}
.cta-band::after{content:"";position:absolute;inset:0;background:radial-gradient(500px 200px at 80% 0%,rgba(255,255,255,.18),transparent 60%)}
.cta-band h2{color:#fff}
.cta-band p{color:rgba(255,255,255,.88);max-width:560px;margin:0 auto 1.4em}
.cta-band .btn-light{position:relative;z-index:1}

/* ---------- Footer ---------- */
.footer{background:#0a2540;color:#aebfcF;padding:var(--s-16) 0 var(--s-8);margin-top:var(--s-20)}
.footer a{color:#c5d3e4}
.footer a:hover{color:#fff}
.footer-grid{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:var(--s-8)}
.footer h5{color:#fff;font-size:13.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:var(--s-4)}
.footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.footer ul a{font-size:14px;min-height:32px;display:inline-flex;align-items:center}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:var(--s-10);padding-top:var(--s-6);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#8aa0b8}
.footer .brand{color:#fff}
.footer-tag{font-size:14px;max-width:280px;line-height:1.6}

/* ---------- Forms ---------- */
.form-wrap{max-width:460px;margin:var(--s-12) auto}
.form-card{padding:var(--s-8)}
.form-narrow{max-width:520px;margin:0 auto}
.field{margin-bottom:var(--s-5)}
.field label{display:block;font-family:var(--font-display);font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--text)}
.field .hint{font-size:12.5px;color:var(--muted-2);margin-top:5px}
.input,.select,textarea.input{
  width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--border-strong);border-radius:var(--r);
  font-family:var(--font-body);font-size:14.5px;color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s;
}
textarea.input{min-height:110px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.input.invalid{border-color:var(--danger);background:#fffafa}
.input.invalid:focus{box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.error-msg{display:none;color:var(--danger);font-size:12.5px;font-weight:600;margin-top:5px;align-items:flex-start;gap:5px}
.error-msg.show{display:flex}
.checkbox-row{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:44px}
.checkbox-row input{width:18px;height:18px;margin-top:3px;accent-color:var(--primary);flex:none;cursor:pointer}
.checkbox-row .lbl{font-size:13.5px;color:var(--muted);line-height:1.5}
.form-success{background:var(--success-soft);border:1px solid #b7e4c7;color:#14532d;border-radius:var(--r-md);padding:14px 16px;display:flex;gap:10px;align-items:flex-start;margin-bottom:var(--s-5);font-size:14px}
.form-error-banner{background:var(--danger-soft);border:1px solid #f5c2c2;color:#7f1d1d;border-radius:var(--r-md);padding:14px 16px;margin-bottom:var(--s-5);font-size:14px}
.divider-or{display:flex;align-items:center;gap:14px;color:var(--muted-2);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:var(--s-5) 0}
.divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border)}

/* Google button */
.btn-google{background:#fff;border:1px solid var(--border-strong);color:var(--text);box-shadow:var(--shadow-xs)}
.btn-google:hover{border-color:#94a3b8;transform:translateY(-1px);color:var(--text)}
.btn-google svg{width:18px;height:18px}

/* ---------- Auth layout ---------- */
.auth-shell{min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;padding:var(--s-10) var(--s-4);
  background:linear-gradient(180deg,var(--bg-grad-1),var(--bg) 60%)}
.auth-side{display:none}

/* ---------- Pricing ---------- */
.price-grid{display:grid;grid-template-columns:repeat(2,minmax(0,440px));gap:var(--s-6);justify-content:center}
.price-card{position:relative;display:flex;flex-direction:column;padding:var(--s-8);background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm)}
.price-card.pro{border-color:var(--primary);box-shadow:var(--shadow-lg)}
.price-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#2563eb,#4f46e5);color:#fff;font-family:var(--font-display);font-weight:800;font-size:12px;padding:5px 16px;border-radius:var(--r-pill);letter-spacing:.03em}
.price-amount{font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:-.03em;margin:var(--s-3) 0 0}
.price-amount .per{font-size:15px;font-weight:600;color:var(--muted-2);letter-spacing:0}
.price-feats{list-style:none;padding:0;margin:var(--s-6) 0;display:flex;flex-direction:column;gap:11px;flex:1}
.price-feats li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.price-feats svg{width:18px;height:18px;color:var(--success);flex:none;margin-top:2px}
.price-feats .off{color:var(--muted-2)}
.price-feats .off svg{color:var(--border-strong)}
.compare-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.compare-table th,.compare-table td{padding:13px 18px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
.compare-table th{background:var(--surface-2);font-family:var(--font-display);font-size:13.5px}
.compare-table td:not(:first-child),.compare-table th:not(:first-child){text-align:center;width:150px}
.compare-table tr:last-child td{border-bottom:none}
.compare-table .yes{color:var(--success);font-weight:800}
.compare-table .no{color:var(--border-strong);font-weight:800}

/* ---------- Legal ---------- */
.legal{max-width:800px;margin:var(--s-12) auto;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-10);box-shadow:var(--shadow-xs)}
.legal h2{font-size:23px;margin-top:var(--s-8)}
.legal h2:first-child{margin-top:0}
.legal ul{padding-left:22px;color:var(--muted)}
.legal ul li{margin-bottom:8px}
.legal .updated{color:var(--muted-2);font-size:13.5px}

/* ---------- Contact ---------- */
.contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s-8);align-items:start}
.contact-info .ci-row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.contact-info .ci-ico{width:42px;height:42px;border-radius:var(--r-md);background:var(--primary-soft);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex:none}
.contact-info .ci-ico svg{width:20px;height:20px}

/* ---------- Recommend ---------- */
.reco-hero{background:linear-gradient(180deg,var(--bg-grad-1),var(--bg));padding:var(--s-12) 0}
.plan-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:var(--s-6)}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cal-day{border:1px solid var(--border);border-radius:var(--r-md);padding:12px;background:var(--surface-2)}
.cal-day b{font-family:var(--font-display);font-size:13px;display:block;margin-bottom:4px;color:var(--primary-dark)}
.cal-day span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block}
.prio-bar{height:9px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;margin-top:6px}
.prio-bar i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,#2563eb,#4f46e5)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud span{background:var(--surface-2);border:1px solid var(--border);padding:5px 12px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--muted)}

/* ============================================================
   DASHBOARD
   ============================================================ */
.dash{display:flex;min-height:100vh;background:var(--bg)}
.sidebar{
  width:248px;flex:none;background:#0d2b4d;color:#c3d2e4;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:50;
}
.sidebar .brand{color:#fff;padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-nav{padding:var(--s-4) 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.side-nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r);color:#a9bdd6;font-weight:600;font-size:14px;font-family:var(--font-display);min-height:44px;transition:background .15s,color .15s}
.side-nav a svg{width:19px;height:19px;flex:none}
.side-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side-nav a.active{background:linear-gradient(90deg,rgba(37,99,235,.9),rgba(79,70,229,.9));color:#fff;box-shadow:var(--shadow-primary)}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.plan-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;font-family:var(--font-display);padding:5px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.1);color:#fff}
.plan-pill.pro{background:linear-gradient(90deg,#2563eb,#4f46e5)}
.dash-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  height:64px;display:flex;align-items:center;gap:14px;padding:0 var(--s-6);position:sticky;top:0;z-index:40;
}
.topbar h1{font-size:19px;margin:0}
.topbar .sp{flex:1}
.mobile-side-toggle{display:none;width:44px;height:44px;border:1px solid var(--border);background:#fff;border-radius:var(--r);align-items:center;justify-content:center;cursor:pointer}
.dash-content{padding:var(--s-8);max-width:1180px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:var(--s-6)}
.page-head h1{margin-bottom:4px}
.page-head p{margin:0;color:var(--muted);font-size:14px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-5);margin-bottom:var(--s-6)}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-5);box-shadow:var(--shadow-xs)}
.kpi .kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpi .kpi-label{font-size:12.5px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-display)}
.kpi .kpi-ico{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary-dark)}
.kpi .kpi-ico svg{width:19px;height:19px}
.kpi .kpi-val{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .kpi-delta{font-size:12.5px;font-weight:700;margin-top:8px;display:flex;align-items:center;gap:4px}
.kpi .up{color:var(--success)}
.kpi .down{color:var(--danger)}
.kpi .flat{color:var(--muted-2)}

/* Charts */
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-6);box-shadow:var(--shadow-xs);margin-bottom:var(--s-6)}
.chart-card h3{font-size:16px;margin-bottom:2px}
.chart-card .sub{font-size:13px;color:var(--muted-2);margin-bottom:var(--s-5)}
.bar-row{display:grid;grid-template-columns:110px 1fr 60px;gap:12px;align-items:center;margin-bottom:12px;font-size:13px}
.bar-row .bl{font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.bar-row .bt{height:10px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.bar-row .bt i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,#3b82f6,#4f46e5);transition:width .6s ease}
.bar-row .bv{text-align:right;font-weight:800;font-family:var(--font-display);color:var(--text)}

/* Tables */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-xs)}
.table-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--border);background:#fbfcfe}
.search-box{position:relative;flex:1;min-width:200px;max-width:340px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted-2)}
.search-box input{width:100%;min-height:40px;padding:8px 12px 8px 36px;border:1px solid var(--border-strong);border-radius:var(--r-pill);font-size:14px}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{
  text-align:left;padding:12px 16px;font-family:var(--font-display);font-size:12px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted-2);background:var(--surface-2);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;white-space:nowrap;
}
table.data th:hover{color:var(--primary-dark)}
table.data th .sort-ind{font-size:10px;margin-left:4px}
table.data td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr{transition:background .12s}
table.data tbody tr:hover{background:var(--primary-tint)}
.cell-title{font-weight:700;color:var(--text);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-cap{font-size:12px;color:var(--muted-2);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;font-family:var(--font-display);padding:4px 11px;border-radius:var(--r-pill);text-transform:capitalize;white-space:nowrap}
.badge.draft{background:var(--surface-3);color:var(--muted)}
.badge.scheduled{background:var(--info-soft);color:var(--info)}
.badge.published{background:var(--success-soft);color:#0c6b3d}
.badge.facebook{background:#e7f0fe;color:var(--fb)}
.badge.instagram{background:#fce7f3;color:#be185d}
.badge.whatsapp{background:#dcfce7;color:#15803d}
.badge.tiktok{background:#e2e8f0;color:#0f172a}
.badge.x{background:#e2e8f0;color:#0f172a}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:38px;height:38px;border:1px solid transparent;background:none;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-2);transition:all .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#f5c2c2}
.icon-btn svg{width:17px;height:17px}
.table-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:var(--s-4) var(--s-5);border-top:1px solid var(--border);background:#fbfcfe;flex-wrap:wrap}
.pager{display:flex;gap:4px;align-items:center}
.pager button{min-width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.pager button:hover:not([disabled]){border-color:var(--primary);color:var(--primary-dark)}
.pager button.cur{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button[disabled]{opacity:.4;cursor:not-allowed}

/* States: empty / loading / error */
.state{padding:var(--s-12) var(--s-6);text-align:center}
.state .state-ico{width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto var(--s-4);color:var(--muted-2)}
.state .state-ico svg{width:30px;height:30px}
.state h3{margin-bottom:6px}
.state p{color:var(--muted);max-width:380px;margin:0 auto 18px;font-size:14px}
.skeleton{background:linear-gradient(90deg,#eef2f7 25%,#f7fafc 37%,#eef2f7 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r)}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-line{height:14px;margin-bottom:10px;border-radius:6px}
.sk-block{height:120px;border-radius:var(--r-lg)}
.error-panel{background:var(--danger-soft);border:1px solid #f5c2c2;border-radius:var(--r-lg);padding:var(--s-8);text-align:center;color:#7f1d1d}
.error-panel svg{width:34px;height:34px;margin-bottom:10px}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,37,64,.5);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:var(--s-4);
  animation:fadeIn .2s ease;
}
.modal{
  background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow-lg);width:100%;max-width:520px;
  max-height:92vh;overflow-y:auto;animation:popIn .25s ease;
}
.modal.modal-lg{max-width:640px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s-5) var(--s-6);border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:1}
.modal-head h3{margin:0;font-size:18px}
.modal-body{padding:var(--s-6)}
.modal-foot{padding:var(--s-5) var(--s-6);border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-x{width:40px;height:40px;border:none;background:var(--surface-2);border-radius:50%;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--surface-3);color:var(--text)}
.modal-x svg{width:18px;height:18px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{
  background:#0a2540;color:#fff;padding:13px 16px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);
  display:flex;gap:10px;align-items:flex-start;font-size:14px;animation:slideUp .25s ease;
}
.toast.success{background:#0c6b3d}
.toast.error{background:#991b1b}
.toast svg{width:19px;height:19px;flex:none;margin-top:1px}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Generator */
.gen-out{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:var(--s-5);font-size:14px;line-height:1.65;white-space:pre-wrap;min-height:120px}
.platform-choice{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.plat-choice{
  border:1.5px solid var(--border);border-radius:var(--r-md);padding:10px 6px;background:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;font-family:var(--font-display);
  color:var(--muted);transition:all .15s;min-height:64px;justify-content:center;
}
.plat-choice:hover{border-color:var(--primary);color:var(--primary-dark)}
.plat-choice.sel{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-dark);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.plat-choice .plat-dot{width:30px;height:30px}
.plat-choice .plat-dot svg{width:16px;height:16px}

/* PayBridge */
.pay-steps{display:flex;gap:0;margin:var(--s-5) 0}
.pay-step{flex:1;text-align:center;position:relative;font-size:12px;font-weight:700;color:var(--muted-2);font-family:var(--font-display)}
.pay-step::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.pay-step:first-child::before{display:none}
.pay-step .ps-dot{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--border-strong);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:var(--muted-2);font-size:13px}
.pay-step.done::before,.pay-step.active::before{background:var(--primary)}
.pay-step.done .ps-dot{background:var(--success);border-color:var(--success);color:#fff}
.pay-step.active .ps-dot{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.stk-phone{display:flex;align-items:center;gap:12px;background:var(--success-soft);border:1px solid #b7e4c7;border-radius:var(--r-md);padding:14px 16px;margin:var(--s-4) 0}
.spinner{width:18px;height:18px;border:2.5px solid rgba(37,99,235,.25);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-lg{width:42px;height:42px;border-width:4px;margin:0 auto var(--s-4)}
.check-anim{width:72px;height:72px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto var(--s-4);animation:popIn .4s ease}
.check-anim svg{width:38px;height:38px}

/* Google modal */
.g-modal{max-width:420px;border-radius:var(--r-lg);overflow:hidden}
.g-head{padding:var(--s-6) var(--s-6) var(--s-4);text-align:center;border-bottom:1px solid var(--border)}
.g-logo{font-family:var(--font-display);font-weight:800;font-size:22px;margin-bottom:6px}
.g-logo span:nth-child(1){color:#4285F4}.g-logo span:nth-child(2){color:#EA4335}.g-logo span:nth-child(3){color:#FBBC05}.g-logo span:nth-child(4){color:#4285F4}.g-logo span:nth-child(5){color:#34A853}.g-logo span:nth-child(6){color:#EA4335}
.g-acc{width:100%;display:flex;align-items:center;gap:13px;padding:12px var(--s-6);border:none;background:#fff;cursor:pointer;text-align:left;min-height:56px;border-bottom:1px solid var(--surface-3)}
.g-acc:hover{background:var(--surface-2)}
.g-acc .g-av{width:34px;height:34px;border-radius:50%;background:#1d4ed8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;font-family:var(--font-display)}
.g-acc .g-n{font-weight:700;font-size:14px}
.g-acc .g-e{font-size:12.5px;color:var(--muted-2)}
.g-foot{padding:var(--s-4) var(--s-6);background:var(--surface-2);font-size:12px;color:var(--muted-2)}

/* Progress (posting) */
.post-steps{display:flex;flex-direction:column;gap:14px;margin:var(--s-5) 0}
.post-step{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;color:var(--muted-2)}
.post-step .ps-ic{width:28px;height:28px;border-radius:50%;background:var(--surface-3);color:var(--muted-2);display:flex;align-items:center;justify-content:center;flex:none}
.post-step.done .ps-ic{background:var(--success-soft);color:var(--success)}
.post-step.active .ps-ic{background:var(--primary-soft);color:var(--primary)}
.post-step.done{color:var(--text)}
.post-step .ps-ic svg{width:15px;height:15px}

/* Social accounts connect list (Settings) */
.social-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.social-row{
  display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--r-md);
  padding:12px 14px;background:var(--surface-2);transition:border-color .15s,box-shadow .15s;
}
.social-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.social-ico{
  width:38px;height:38px;border-radius:10px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;
}
.social-meta{flex:1;min-width:0}
.social-name{font-family:var(--font-display);font-weight:700;font-size:14px;line-height:1.2}
.social-handle{font-size:12.5px;color:var(--success);font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.social-handle.off{color:var(--muted-2)}
.social-handle svg{width:14px;height:14px;flex:none}
.social-actions{display:flex;gap:6px;flex:none}
.social-row .btn-sm{min-height:34px;padding:0 12px}
.conn-dot{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--success);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-xs)}
.conn-dot svg{width:13px;height:13px}
.plat-choice{position:relative}

/* Publish modal target */
.publish-target{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px}

/* Footer social — compact icon links */
.footer-social{display:flex;gap:8px;margin-top:16px}
.footer-social a{
  width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);color:#dbe6f3;transition:background .15s,transform .15s,color .15s;min-width:34px;
}
.footer-social a:hover{background:var(--primary);color:#fff;transform:translateY(-2px)}
.footer-social a svg{width:16px;height:16px}

/* Settings toggles */
.toggle{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:var(--r-pill);cursor:pointer;transition:.2s}
.toggle .sl::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--shadow-xs)}
.toggle input:checked + .sl{background:var(--primary)}
.toggle input:checked + .sl::before{transform:translateX(20px)}
.toggle input:focus-visible + .sl{outline:3px solid rgba(37,99,235,.4)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row .sr-t{font-weight:700;font-size:14.5px;font-family:var(--font-display)}
.setting-row .sr-d{font-size:13px;color:var(--muted-2)}

/* Billing */
.plan-hero{display:flex;gap:var(--s-6);align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#0d2b4d,#1e40af);color:#fff;border-radius:var(--r-lg);padding:var(--s-6);margin-bottom:var(--s-6)}
.plan-hero h3{color:#fff;margin:0;font-size:22px}
.plan-hero .ph-price{font-family:var(--font-display);font-size:34px;font-weight:800}
.plan-hero .ph-price small{font-size:14px;font-weight:600;opacity:.8}
.invoice-table td,.invoice-table th{font-size:13px}

/* Reveal animation */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}
.route-enter{animation:routeIn .3s ease}
@keyframes routeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Responsive */
@media (max-width:980px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .hero-grid{grid-template-columns:1fr;gap:var(--s-10)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr 1fr}
  .footer-grid{grid-template-columns:1fr 1fr;gap:var(--s-8)}
  .contact-grid{grid-template-columns:1fr}
  .price-grid{grid-template-columns:1fr;max-width:440px;margin:0 auto}
  .platform-choice{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:768px){
  .nav-links,.nav-cta .btn-desktop{display:none}
  .nav-toggle{display:flex}
  .nav-cta{margin-left:0}
  .grid-3,.grid-2{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .section{padding:var(--s-12) 0}
  .hero{padding:var(--s-12) 0}
  .footer-grid{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow-lg);width:260px}
  .sidebar.open{transform:none}
  .mobile-side-toggle{display:flex}
  .dash-content{padding:var(--s-5)}
  .side-backdrop{position:fixed;inset:0;background:rgba(10,37,64,.5);z-index:45}
  .bar-row{grid-template-columns:90px 1fr 52px}
  .legal{padding:var(--s-6)}
  .cta-band{padding:var(--s-8) var(--s-5)}
  .table-scroll{overflow-x:auto}
  table.data{min-width:760px}
  .platform-choice{grid-template-columns:repeat(3,1fr)}
  .social-list{grid-template-columns:1fr}
}
@media (max-width:480px){
  .kpi-grid,.grid-4{grid-template-columns:1fr}
  .hero-cta .btn{width:100%}
  .toast-wrap{left:12px;right:12px;max-width:none}
}

</style>

/* Andika — utilities */
(function(){
  const App = window.App = window.App || {};
  const U = App.utils = {};

  U.qs  = (sel, el) => (el||document).querySelector(sel);
  U.qsa = (sel, el) => Array.from((el||document).querySelectorAll(sel));

  U.esc = function(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  };

  U.uid = function(prefix){
    return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  };

  U.hash = function(str){
    // lightweight non-reversible hash for local demo credentials
    let h = 5381;
    str = 'andika::'+String(str)+'::salt-254';
    for(let i=0;i<str.length;i++){ h = ((h<<5)+h)^str.charCodeAt(i); }
    return 'h'+(h>>>0).toString(16);
  };

  U.fmtKES = function(n){
    return 'Ksh ' + Number(n||0).toLocaleString('en-KE');
  };
  U.fmtNum = function(n){ return Number(n||0).toLocaleString('en-KE'); };

  U.fmtDate = function(iso, withTime){
    if(!iso) return '—';
    const d = new Date(iso);
    if(isNaN(d)) return '—';
    const opts = { day:'numeric', month:'short', year:'numeric' };
    let s = d.toLocaleDateString('en-KE', opts);
    if(withTime){ s += ', ' + d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}); }
    return s;
  };
  U.fmtDateShort = function(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-KE',{day:'numeric',month:'short'});
  };
  U.todayISO = function(){ return new Date().toISOString().slice(0,10); };
  U.monthFromNow = function(){ const d=new Date(); d.setMonth(d.getMonth()+1); return d.toISOString(); };

  U.isValidEmail = function(e){
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim().toLowerCase());
  };
  // Kenyan phone: 07xx / 01xx / +254xx / 254xx — 9 digits after 0 / 254
  U.normalizeKEPhone = function(p){
    let s = String(p||'').replace(/[\s-]/g,'');
    if(s.startsWith('+254')) s = '0'+s.slice(4);
    else if(s.startsWith('254')) s = '0'+s.slice(3);
    if(/^0[17]\d{8}$/.test(s)) return s;
    return null;
  };
  U.mpesaDisplay = function(p){
    const n = U.normalizeKEPhone(p);
    if(!n) return String(p||'');
    return '+254 ' + n.slice(1,4) + ' ' + n.slice(4,7) + ' ' + n.slice(7);
  };

  U.debounce = function(fn, ms){
    let t; return function(){ const a=arguments, c=this; clearTimeout(t); t=setTimeout(()=>fn.apply(c,a), ms||250); };
  };

  U.download = function(filename, text, type){
    const blob = new Blob([text], {type: type||'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 300);
  };

  U.toCSV = function(rows, columns){
    const head = columns.map(c=>'"'+c.label.replace(/"/g,'""')+'"').join(',');
    const lines = rows.map(r => columns.map(c=>{
      let v = c.get ? c.get(r) : r[c.key];
      v = v == null ? '' : String(v).replace(/"/g,'""');
      return '"'+v+'"';
    }).join(','));
    return head + '\n' + lines.join('\n');
  };

  U.copy = async function(text){
    try{ await navigator.clipboard.writeText(text); return true; }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); ta.remove(); return true; }catch(_){ ta.remove(); return false; }
    }
  };

  U.initials = function(name){
    const parts = String(name||'?').trim().split(/\s+/);
    return ((parts[0]||'?')[0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  };

  U.qsParse = function(search){
    const out = {};
    String(search||'').replace(/^\?/,'').split('&').filter(Boolean).forEach(pair=>{
      const i = pair.indexOf('=');
      const k = decodeURIComponent(i<0?pair:pair.slice(0,i));
      const v = i<0?'':decodeURIComponent(pair.slice(i+1).replace(/\+/g,'%20'));
      out[k]=v;
    });
    return out;
  };

  U.weekAgo = function(n){ const d=new Date(); d.setDate(d.getDate()-7*n); return d; };

  // delay helper for simulated network
  U.wait = function(ms){ return new Promise(res=>setTimeout(res, ms)); };

  U.PLATFORMS = [
    {id:'facebook',  name:'Facebook',  color:'#1877f2'},
    {id:'instagram', name:'Instagram', color:'#c13584'},
    {id:'whatsapp',  name:'WhatsApp',  color:'#25d366'},
    {id:'tiktok',    name:'TikTok',    color:'#0f172a'},
    {id:'x',         name:'X',         color:'#0f172a'}
  ];
  U.platform = function(id){ return U.PLATFORMS.find(p=>p.id===id) || U.PLATFORMS[0]; };

  U.CATEGORIES = ['Promotion','Educational','Engagement','Announcement','Testimonial'];
  U.STATUSES   = ['draft','scheduled','published'];
})();

/* Andika — data store (persisted, per-user isolation) */
(function(){
  const App = window.App = window.App || {};
  const U = App.utils;
  const KEYS = {
    users:'andika_users', session:'andika_session', records:'andika_records',
    payments:'andika_payments', messages:'andika_messages'
  };

  function read(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function write(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }
    catch(e){ App.toast && App.toast('Storage is unavailable in this browser','error'); }
  }

  const Store = App.store = {
    /* ---------- users / auth ---------- */
    users(){ return read(KEYS.users, []); },
    saveUsers(u){ write(KEYS.users, u); },

    findUserByEmail(email){
      const e = String(email||'').trim().toLowerCase();
      return this.users().find(u => u.email.toLowerCase() === e) || null;
    },
    getUser(id){ return this.users().find(u=>u.id===id) || null; },

    signup({name, email, password}){
      email = String(email).trim().toLowerCase();
      if(this.findUserByEmail(email)){
        const err = new Error('An account with this email already exists. Sign in instead.');
        err.field = 'email'; throw err;
      }
      const user = {
        id: U.uid('usr'),
        name: String(name||'').trim(),
        email,
        passHash: U.hash(password),
        google: false,
        createdAt: new Date().toISOString(),
        plan: 'free',
        planRenewsAt: null,
        planCancelsAt: null,
        profile: { businessName:'', businessType:'', county:'Nairobi', phone:'', bio:'' },
        settings: { defaultPlatform:'instagram', defaultTone:'Friendly & warm', weeklyGoal:5, emailDigest:true, plannerReminder:'Monday' },
        socials: {}
      };
      const users = this.users(); users.push(user); this.saveUsers(users);
      write(KEYS.session, user.id);
      return user;
    },

    signin({email, password}){
      const user = this.findUserByEmail(email);
      if(!user || !user.passHash || user.passHash !== U.hash(password)){
        const err = new Error('Invalid email or password. Please try again.');
        err.field = 'password'; throw err;
      }
      write(KEYS.session, user.id);
      return user;
    },

    googleSignin({name, email}){
      email = String(email).trim().toLowerCase();
      let user = this.findUserByEmail(email);
      if(!user){
        user = {
          id: U.uid('usr'), name: name || email.split('@')[0].replace(/[._]/g,' '),
          email, passHash:null, google:true,
          createdAt: new Date().toISOString(), plan:'free', planRenewsAt:null, planCancelsAt:null,
          profile:{ businessName:'', businessType:'', county:'Nairobi', phone:'', bio:'' },
          settings:{ defaultPlatform:'instagram', defaultTone:'Friendly & warm', weeklyGoal:5, emailDigest:true, plannerReminder:'Monday' },
          socials:{}
        };
        const users = this.users(); users.push(user); this.saveUsers(users);
      }
      write(KEYS.session, user.id);
      return user;
    },

    signout(){ localStorage.removeItem(KEYS.session); },

    currentUserId(){ return read(KEYS.session, null); },
    currentUser(){
      const id = this.currentUserId();
      if(!id) return null;
      const u = this.getUser(id);
      if(!u){ localStorage.removeItem(KEYS.session); return null; }
      // apply pending cancellation / renewal
      let changed = false;
      if(u.plan === 'pro' && u.planCancelsAt && new Date(u.planCancelsAt) <= new Date()){
        u.plan = 'free'; u.planRenewsAt = null; u.planCancelsAt = null; changed = true;
      }
      if(changed) this.updateUser(u);
      return u;
    },

    updateUser(patch){
      const users = this.users();
      const i = users.findIndex(u=>u.id===patch.id);
      if(i<0) return null;
      users[i] = Object.assign({}, users[i], patch);
      this.saveUsers(users);
      return users[i];
    },

    changePassword(userId, currentPass, newPass){
      const u = this.getUser(userId);
      if(!u) throw new Error('User not found.');
      if(u.passHash && u.passHash !== U.hash(currentPass)){
        const e = new Error('Your current password is incorrect.'); e.field='currentPassword'; throw e;
      }
      this.updateUser({id:userId, passHash: U.hash(newPass)});
    },

    deleteAccount(userId){
      this.saveUsers(this.users().filter(u=>u.id!==userId));
      write(KEYS.records, this.allRecords().filter(r=>r.userId!==userId));
      write(KEYS.payments, this.allPayments().filter(p=>p.userId!==userId));
      localStorage.removeItem(KEYS.session);
    },

    /* ---------- content records (isolated per user) ---------- */
    allRecords(){ return read(KEYS.records, []); },
    listRecords(userId){
      return this.allRecords().filter(r=>r.userId===userId)
        .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    },
    getRecord(id, userId){
      return this.allRecords().find(r=>r.id===id && r.userId===userId) || null;
    },
    addRecord(rec){
      const all = this.allRecords();
      const row = Object.assign({
        id: U.uid('rec'),
        createdAt: new Date().toISOString(),
        status:'draft', caption:'', category:'Promotion',
        scheduledFor:null, publishedAt:null,
        stats:null
      }, rec);
      all.push(row); write(KEYS.records, all);
      return row;
    },
    updateRecord(id, userId, patch){
      const all = this.allRecords();
      const i = all.findIndex(r=>r.id===id && r.userId===userId);
      if(i<0) throw new Error('Record not found.');
      all[i] = Object.assign({}, all[i], patch);
      write(KEYS.records, all);
      return all[i];
    },
    deleteRecord(id, userId){
      write(KEYS.records, this.allRecords().filter(r=>!(r.id===id && r.userId===userId)));
    },

    /* ---------- payments / billing ---------- */
    allPayments(){ return read(KEYS.payments, []); },
    listPayments(userId){
      return this.allPayments().filter(p=>p.userId===userId)
        .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    },
    addPayment(pay){

      const s = this.getSocial(userId, platform);
      return !!(s && s.connected);
    },
    connectSocial(userId, platform, handle, displayName){

        handle: String(handle||'').replace(/^@+/,''),
        displayName: displayName || ('@'+String(handle||'').replace(/^@+/,'')),

      return socials[platform];
    },
    disconnectSocial(userId, platform){
      const u = this.getUser(userId);
      const socials = Object.assign({}, u.socials || {});
      if(socials[platform]){
        socials[platform] = { connected:false, handle:'', displayName:'', connectedAt:null };

    addMessage(msg){

      all.push(row); write(KEYS.messages, all);
      return row;
    }
  };
})();

/* Andika — PayBridge checkout client
   Built-in checkout endpoint simulation (M-Pesa STK-push style).
   No external key required. To go live, replace `requestStkPush`
   with a fetch() to your PayBridge endpoint URL and keep the same
   promise contract: resolve({reference}) on success, reject(Error) on failure. */
(function(){
  const App = window.App = window.App || {};
  const U = App.utils;

  // const PAYBRIDGE_ENDPOINT = 'https://checkout.paybridge.ke/v1/stk'; // live example
  const PAYBRIDGE_MERCHANT = 'ANDIKA LTD';

  const PayBridge = App.paybridge = {
    merchant: PAYBRIDGE_MERCHANT,

    validatePhone(phone){
      return U.normalizeKEPhone(phone);
    },

    /**
     * Initiate an STK push. Returns a promise that resolves with a payment
     * receipt after the simulated push is "accepted" on the handset.
     * onStage(stage) callbacks: 'initiated' | 'prompt' | 'processing' | 'done'
     */
    async requestStkPush({ phone, amount, plan } = {}, onStage){
      const msisdn = this.validatePhone(phone);
      if(!msisdn){
        const e = new Error('Enter a valid Safaricom number, e.g. 0712 345 678');
        e.field = 'phone'; throw e;
      }
      amount = Number(amount) || 0;
      if(amount < 1) throw new Error('Amount must be greater than zero.');

      onStage && onStage('initiated');
      await U.wait(900);   // contact PayBridge gateway
      onStage && onStage('prompt');
      await U.wait(2200);  // customer enters PIN on handset
      onStage && onStage('processing');
      await U.wait(1100);  // gateway confirmation

      const ref = 'PB' + Date.now().toString().slice(-8) + Math.floor(Math.random()*90+10);
      onStage && onStage('done');
      return {
        reference: ref,
        msisdn,
        amount,
        currency: 'KES',
        plan: plan || 'pro',
        channel: 'M-PESA',
        receipt: 'QHK' + Math.floor(100000 + Math.random()*899999),
        paidAt: new Date().toISOString()
      };
    },

    /** Used by the checkout page to cancel an in-flight attempt (no-op after settle). */
    cancel(){ /* simulation hook */ }
  };
})();

/* Andika — social publishing client
   Opens the real platform composer for each connected account, with the
   caption pre-filled (WhatsApp/X/Facebook share) or copied and the app
   opened ready to paste (Instagram/TikTok, which have no web post API).
   Mirrors a live API integration: call publish({...}) -> progress + result. */
(function(){
  const App = window.App = window.App || {};
  const U = App.utils;

  const STEPS = {
    facebook:  ['Preparing your post','Copying caption','Opening Facebook'],
    instagram: ['Preparing your post','Copying caption','Opening Instagram'],
    whatsapp:  ['Preparing your status','Copying caption','Opening WhatsApp'],
    tiktok:    ['Preparing your video','Copying caption','Opening TikTok'],
    x:         ['Preparing your post','Copying caption','Opening X']
  };

  function openWindow(url){
    try{
      const w = window.open(url, '_blank', 'noopener,noreferrer');
      // some in-app browsers block popups; fall back to location
      if(!w){ window.open(url, '_blank'); }
      return true;
    }catch(e){ return false; }
  }

  /**
   * Build the real destination for a platform.
   * whatsapp/instagram/tiktok use deep links that open the mobile app when
   * present, else the web profile; facebook uses the sharer; x uses intent.
   */
  function composerUrl(platform, handle, caption){
    const text = encodeURIComponent(caption);
    const h = (handle||'').replace(/^@+/,'');
    switch(platform){
      case 'whatsapp':
        // WhatsApp Business status composer isn't deep-linkable directly;
        // open the app to chat/status where the user pastes into Status.
        return U.normalizeKEPhone(h)
          ? 'https://wa.me/' + h.replace(/^0/,'254') + '?text=' + text
          : 'whatsapp://app';
      case 'x':
        return 'https://twitter.com/intent/tweet?text=' + text;
      case 'facebook':
        // sharer pre-fills text on the user's feed/page composer
        return 'https://www.facebook.com/dialog/share?app_id=ws_andika&display=popup&href=' +
               encodeURIComponent('https://andika.co.ke') + '&quote=' + text +
               (h ? '&hashtag=%23' + encodeURIComponent(h) : '');
      case 'instagram':
        // Instagram has no web caption API; open the app / profile to paste.
        return h ? 'https://www.instagram.com/' + encodeURIComponent(h) + '/' : 'https://www.instagram.com/';
      case 'tiktok':
        return h ? 'https://www.tiktok.com/@' + encodeURIComponent(h) : 'https://www.tiktok.com/upload';
      default:
        return '#';
    }
  }

  App.social = {
    supported: U.PLATFORMS.map(p=>p.id),

    composerUrl,

    /**
     * Publish a post. Runs progress steps, copies the caption to the
     * clipboard (so it can be pasted where pre-fill isn't supported), then
     * opens the platform. Resolves with the result used to mark the record.
     */
    async publish({ platform, caption, recordId, handle }, onStep){
      const p = U.platform(platform);
      const steps = STEPS[platform] || STEPS.instagram;
      for(let i=0;i<steps.length;i++){
        onStep && onStep(i, steps[i]);
        await U.wait(420 + Math.random()*260);
      }
      // copy caption so it's ready to paste everywhere
      await U.copy(caption);
      const url = composerUrl(platform, handle, caption);
      const opened = openWindow(url);
      const stats = App.generator.statsFor();
      return {
        ok: true,
        platform,
        externalId: U.uid('post'),
        link: url,
        platformName: p.name,
        handle: handle || '',
        opened,
        publishedAt: new Date().toISOString(),
        stats
      };
    }
  };
})();

  /* ---------------- Modal ---------------- */
  App.openModal = function({ title, body, footer, size, onClose }){
    const back = document.createElement('div');

      <div class="modal-head"><h3>${U.esc(title||'')}</h3>

    const bodyEl = U.qs('.modal-body', back);
    if(typeof body === 'string') bodyEl.innerHTML = body;
    else if(body) bodyEl.appendChild(body);
    if(footer){
      const foot = U.qs('.modal-foot', back);
      if(typeof footer === 'string') foot.innerHTML = footer;
      else foot.appendChild(footer);
    }
    document.body.appendChild(back);
    document.body.style.overflow = 'hidden';

    function close(){

    line(points, opts){
      opts = opts || {};
      const W = 640, H = 220, pad = { l:44, r:16, t:18, b:30 };
      const vals = points.map(p=>p.value);
      const max = Math.max(1, ...vals) * 1.15;
      const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
      const x = i => pad.l + (points.length===1 ? iw/2 : i * iw/(points.length-1));
      const y = v => pad.t + ih - (v/max)*ih;
      const path = points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      const area = `${path} L${x(points.length-1).toFixed(1)},${pad.t+ih} L${x(0).toFixed(1)},${pad.t+ih} Z`;
      const grid = [0,.25,.5,.75,1].map(f=>{
        const gy = pad.t + ih - f*ih;
        return `<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="#e3e8f0" stroke-width="1"/>

      }).join('');
      const dots = points.map((p,i)=>
        `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.5" fill="#fff" stroke="#2563eb" stroke-width="2"/>
         <text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#6b7c93" font-family="Inter,sans-serif">${U.esc(p.label)}</text>`).join('');
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${U.esc(opts.ariaLabel||'Trend chart')}" style="display:block">
        <defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
        </linearGradient></defs>
        ${grid}
        <path d="${area}" fill="url(#areaG)"/>
        <path d="${path}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
      </svg>`;
    },
    // data: [{label, value, color?}]
    bars(data){

      const total = slices.reduce((a,s)=>a+s.value,0) || 1;

  /* ---------------- Scroll reveal ---------------- */
  let revealObserver = null;
  App.observeReveals = function(root){
    if(!('IntersectionObserver' in window)){
      U.qsa('.reveal', root).forEach(el=>el.classList.add('visible'));
      return;
    }
    if(!revealObserver){
      revealObserver = new IntersectionObserver(entries=>{
        entries.forEach(en=>{
          if(en.isIntersecting){ en.target.classList.add('visible'); revealObserver.unobserve(en.target); }
        });
      }, { threshold:.12 });
    }
    U.qsa('.reveal:not(.visible)', root).forEach(el=>revealObserver.observe(el));
  };

  App.skeletonCard = function(h){ return `<div class="skeleton sk-block" style="height:${h||120}px"></div>`; };
  App.spinner = `<div class="spinner" role="status" aria-label="Loading"></div>`;

/* Andika — hash router with guards, SEO metadata, 404 handling */
(function(){
  const App = window.App = window.App || {};
  const U = App.utils;

  // Each page: { key, path (exact) or pattern, render(ctx), auth?, chrome }
  const pages = App.pages = {};

  App.registerPage = function(def){ pages[def.key] = def; };

  function parseHash(){
    let raw = (location.hash || '').replace(/^#/, '') || '/';
    let qIndex = raw.indexOf('?');
    const path = qIndex < 0 ? raw : raw.slice(0, qIndex);
    const query = qIndex < 0 ? {} : U.qsParse(raw.slice(qIndex+1));
    return { path: path || '/', query, raw };
  }

  function setMeta(def){
    const title = def.title ? `${def.title} · Andika` : 'Andika — Content that sells for Kenyan small businesses';
    document.title = title;
    let tag = document.querySelector('meta[name="description"]');
    if(!tag){
      tag = document.createElement('meta'); tag.setAttribute('name','description');
      document.head.appendChild(tag);
    }
    tag.setAttribute('content', def.description ||
      'Andika helps Kenyan small businesses create social media content and post to Facebook, Instagram, WhatsApp, TikTok and X — from one simple dashboard. Start free.');
  }

  let currentRoute = null;

  App.go = function(hash){ location.hash = hash; };

  App.router = {
    current: () => currentRoute,

    start(){
      window.addEventListener('hashchange', ()=>this.resolve(true));
      this.resolve(false);
    },

    resolve(navigated){
      const { path, query } = parseHash();

      // redirect bare dashboard
      if(path === '/dashboard' || path === '/dashboard/'){
        location.hash = '#/dashboard/overview'; return;
      }

      // match pages — the catch-all 404 is always evaluated last
      let def = null;
      for(const k in pages){
        if(k === 'notfound') continue;
        const p = pages[k];
        if(p.exact){ if(p.path === path){ def = p; break; } }
        else if(p.pattern && p.pattern.test(path)){ def = p; break; }
      }

      if(!def){
        def = pages['notfound'];
      }

      // auth guard
      if(def.auth && !App.store.currentUser()){
        const next = encodeURIComponent(path + (Object.keys(query).length ? '?' + new URLSearchParams(query).toString() : ''));
        const signRoute = def.key === 'checkout' ? '/signup' : '/signin';
        location.hash = '#' + signRoute + '?next=' + next;
        return;
      }

      // signed-in users skip auth screens
      if((def.key === 'signin' || def.key === 'signup') && App.store.currentUser()){
        location.hash = '#/dashboard/overview'; return;
      }

      currentRoute = { key: def.key, path, query };
      setMeta(def);

      try{
        def.render({ path, query });
      }catch(err){
        console.error('Render error:', err);
        const app = U.qs('#app');
        app.innerHTML = `<main class="container" style="padding:80px 20px">
          <div class="error-panel">${App.icons.alert}
          <h3 style="color:inherit">The page failed to load</h3>
          <p>${U.esc(err && err.message || 'Unexpected error.')}</p>
          <a class="btn btn-primary" href="#/">Go home</a></div></main>`;
      }

      if(navigated){ window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' }); }
      else window.scrollTo(0,0);
    }
  };
})();

        if(password.length < 1){ App.setError(form,'password','Enter your password.'); ok=false; }
        if(!ok) return;
        try{
          const user = App.store.signin({ email, password });
          App.toast(`Karibu tena, ${user.name.split(' ')[0]}!`, 'success');
          afterAuth(query);
        }catch(err){
          if(err.field === 'password'){
            view.querySelector('#signinBannerMsg').textContent = ' ' + (err.message);
            banner.style.display = 'flex';
          } else {
            App.toast(err.message || 'Sign in failed.', 'error');
          }
        }
      });
    }
  });
})();

      <h2 style="font-size:22px">Almost there — accept &amp; pay</h2>

  function renderPay(view, user){
    setStep(view, 3);
    const panel = view.querySelector('#checkoutPanel');
    panel.innerHTML = `
      <h2 style="font-size:22px">Pay with M-PESA</h2>
      <p class="muted small">Enter the Safaricom number registered with M-PESA. We will send an STK push to your phone.</p>

        <div class="field">
          <label for="payPhone">M-PESA phone number *</label>

            placeholder="07XX XXX XXX" value="${esc(user.profile.phone || '')}" autocomplete="tel"/>
          <div class="hint">Use the format 0712 345 678 or +254 712 345 678.</div>

      <div id="stkArea" style="display:none"></div>`;

    const form = panel.querySelector('#payForm');
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      App.clearErrors(form);
      const phoneInput = form.querySelector('[name="phone"]');
      const phone = phoneInput.value;
      if(!App.paybridge.validatePhone(phone)){

        return;
      }
      const btn = panel.querySelector('#payBtn');
      btn.disabled = true;
      btn.innerHTML = App.spinner + ' Sending request…';
      await runStk(view, user, phone);
    });
  }

  async function runStk(view, user, phone){
    const panel = view.querySelector('#checkoutPanel');
    const stk = panel.querySelector('#stkArea');
    form_off(stk);
    stk.style.display = 'block';
    stk.innerHTML = `
      <div class="stk-phone">
        <div class="spinner" style="border-color:rgba(15,157,88,.25);border-top-color:var(--success)"></div>
        <div><strong>Check your phone (${esc(U.mpesaDisplay(phone))})</strong><br/>
        <span class="small muted">An M-PESA prompt has been sent. Enter your PIN on your phone to authorise Ksh ${U.fmtKES(PLAN_PRICE)} to Andika Ltd.</span></div>
      </div>
      <div class="post-steps" id="stkSteps"></div>`;
    const stepsList = stk.querySelector('#stkSteps');
    const stages = [
      ['initiated','Connecting to PayBridge…'],
      ['prompt','STK push sent to your handset…'],
      ['processing','Confirming payment with M-PESA…'],
      ['done','Payment received ✅']
    ];
    stages.forEach((s,i)=>{
      const d = document.createElement('div');
      d.className = 'post-step';
      d.innerHTML = `<span class="ps-ic">${i===0?App.spinner:''}</span><span>${s[1]}</span>`;
      stepsList.appendChild(d);
    });
    const mark = (i, state)=>{
      const row = stepsList.children[i];
      if(!row) return;
      row.classList.remove('active');
      row.classList.add(state==='done'?'done':'active');
      const ic = row.querySelector('.ps-ic');
      ic.innerHTML = state==='done' ? I.check : App.spinner;
      if(state==='done' && stepsList.children[i+1]){
        const nx = stepsList.children[i+1];
        nx.classList.add('active');
        nx.querySelector('.ps-ic').innerHTML = App.spinner;
      }
    };
    mark(0,'active');

    try{
      const result = await App.paybridge.requestStkPush(
        { phone, amount: PLAN_PRICE, plan:'pro' },
        stage=>{
          const idx = stages.findIndex(s=>s[0]===stage);
          if(idx>0) mark(idx-1,'done');
          if(stage!=='done') mark(idx,'active');
        }
      );
      mark(3,'done');
      // persist
      const payment = App.store.addPayment({
        userId: user.id, amount: result.amount, currency:'KES',
        reference: result.reference, receipt: result.receipt,
        msisdn: result.msisdn, channel: result.channel, plan:'pro',
        paidAt: result.paidAt
      });
      App.store.activatePro(user.id, payment);
      // also save phone to profile
      App.store.updateUser({ id:user.id, profile: Object.assign({}, user.profile, { phone: result.msisdn }) });

      await U.wait(500);
      renderConfirmation(view, result);
    }catch(err){
      const payErr = panel.querySelector('#payError');
      payErr.style.display = 'block';
      payErr.innerHTML = `${I.alert} <strong>Payment failed.</strong> ${esc(err.message||'No PIN was entered or the push timed out.')} You have not been charged.`;
      const btn = panel.querySelector('#payBtn');
      btn.disabled = false;
      btn.innerHTML = 'Retry STK push';
      stepsList.querySelectorAll('.post-step').forEach(r=>{
        if(r.classList.contains('active')){ r.classList.remove('active'); r.querySelector('.ps-ic').innerHTML=''; }
      });
      stk.style.display = 'none';
    }
  }
  function form_off(){} // placeholder (stk area needs no form teardown)

  function renderConfirmation(view, result){
    setStep(view, 4);
    view.querySelector('#summaryPanel').innerHTML = `

    view.querySelector('#checkoutPanel').innerHTML = `

        <div class="check-anim">${I.checkCircle}</div>
        <h2 style="font-size:24px">Pro activated! 🎉</h2>

        Reference <strong>${esc(result.reference)}</strong>. Unlimited posts, scheduling and full analytics are now unlocked.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:var(--s-5)">

          <a class="btn btn-ghost" href="#/dashboard/billing">View billing</a>
        </div>
      </div>`;
    App.toast('Payment successful — Pro is active! 🎉','success');
  }
})();
